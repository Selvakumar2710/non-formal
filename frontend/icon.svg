<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d45" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#0d9488" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="472" height="472" x="20" y="20" rx="104" ry="104" fill="url(#bgGrad)" filter="url(#glow)" />
  
  <!-- Subtle circular accent halo -->
  <circle cx="256" cy="256" r="168" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" />

  <!-- Medical Cross Group -->
  <g fill="#ffffff">
    <!-- Vertical Bar with rounded ends -->
    <rect x="200" y="100" width="112" height="312" rx="36" ry="36" />
    <!-- Horizontal Bar with rounded ends -->
    <rect x="100" y="200" width="312" height="112" rx="36" ry="36" />
  </g>

  <!-- Glowing Core / Pulse Badge -->
  <circle cx="256" cy="256" r="38" fill="url(#coreGrad)" />
  
  <!-- Center Heartbeat / Cross Accent -->
  <path d="M236 256 L248 256 L253 243 L260 269 L265 256 L276 256" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="4.5" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
</svg>
